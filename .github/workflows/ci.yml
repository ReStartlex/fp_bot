name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Settings (pydantic-settings) требует обязательных полей. В CI нет
    # .env — задаём dummy-значения через env. Тесты оффлайн: реальные
    # ключи не нужны, ns_api_secret должен быть валидным base64.
    env:
      NS_USER_ID: "1"
      NS_LOGIN: "ci"
      NS_PASSWORD: "ci"
      NS_API_SECRET: "QQ=="
      FUNPAY_GOLDEN_KEY: "ci"
      FUNPAY_USER_ID: "1"
      ENABLE_REAL_ACTIONS: "false"
      TELEGRAM_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q
